aid: playplay
name: PlayPlay
description: PlayPlay is an online video and visual creation platform that lets business
  teams produce on-brand videos and images without prior editing experience. Through
  a drag-and-drop editor, AI-assisted tools (text-to-video, script and voice-over
  generation, automatic subtitles) and enterprise collaboration, brand-kit and review
  workflows, it serves marketing, communications and HR teams at large organizations.
  Founded in France and backed by Balderton Capital, Insight Partners and Point Nine,
  PlayPlay is a SaaS product without a public developer API; this API Evangelist profile
  captures its published identity, legal and security surface (ISO 27001, SOC 2, GDPR).
